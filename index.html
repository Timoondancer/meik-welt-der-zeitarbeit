<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TimePartner App – Start</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --tp-dark: #0b2d43;
            --tp-lime: #b5dd35;
            --tp-white: #ffffff;
            --tp-gray: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Nunito", sans-serif;
            background: url("assets/img/hintergrund.png") center center / cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 3rem;
        }

        .button-panel {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .btn {
            padding: 0.9rem 2rem;
            border-radius: 999px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: fit-content;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-config {
            background: var(--tp-lime);
            color: var(--tp-dark);
        }

        .btn-game {
            background: var(--tp-white);
            color: var(--tp-dark);
        }
    </style>
</head>

<body>

    <div class="button-panel">
        <a href="konfigurator.html">
            <button class="btn btn-config">Konfigurator starten →</button>
        </a>

        <a href="humpty-dumpty/index.html">
            <button class="btn btn-game">TimePartner Game spielen 🎮</button>
        </a>
    </div>

</body>
</html>
