<html lang="de">

    <!-- Fonts -->

        :root {
            --tp-blue: #008fd3;
            --tp-blue-dark: #005c8b;
            --tp-green: #7ac143;
            --tp-dark: #121826;
            --tp-muted: #6b7280;
            --tp-border: #e5e7eb;
            --bg-page: #f3f4f6;
            --bg-card: #ffffff;
            --radius-lg: 1.5rem;

        * {

            margin: 0;
            padding: 0;

        body {

            background: var(--bg-page);
            color: var(--tp-dark);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Top Bar ähnlich Accent */

        .top-bar-wrap {
            background: var(--tp-blue);
            color: #ffffff;
        }

            gap: 0.8rem;
        }

        .brand-logo {
            width: 120px;
            height: auto;
        }

        .brand-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .brand-text-main {
            font-family: "Poppins", system-ui, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .brand-text-sub {
            font-size: 0.78rem;
            opacity: 0.9;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 1.1rem;
            font-size: 0.86rem;
        }

            opacity: 0.9;
        }

        .top-nav a:hover {
            opacity: 1;
        }
